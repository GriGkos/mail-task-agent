[project]
name = "mail-task-agent"
version = "0.1.0"
description = "AI agent for Gmail processing and task tracking."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "anthropic>=0.60.0",
    "asyncpg>=0.29.0",
    "beautifulsoup4>=4.12.3",
    "cryptography>=42.0.0",
    "fastapi>=0.111.0",
    "google-api-python-client>=2.137.0",
    "google-auth-oauthlib>=1.2.1",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "msal>=1.31.0",
    "openai>=1.40.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.31",
    "uvicorn[standard]>=0.30.3",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
